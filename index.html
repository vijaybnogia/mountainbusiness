<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to MountainBusiness</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .welcome-text {
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 3px;
      padding: 0 20px;
      background: linear-gradient(90deg, #ffffff, #89f7fe, #66a6ff, #ffffff);
      background-size: 300% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: 
        popIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards,
        shimmer 4s linear infinite,
        float 3s ease-in-out infinite alternate;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(40px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    @keyframes shimmer {
      to {
        background-position: 300% center;
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(-12px);
      }
    }
  </style>
</head>
<body>

  <h1 class="welcome-text">Welcome to MountainBusiness</h1>

</body>
</html>
